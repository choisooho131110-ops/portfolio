<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니 도감 — 원하는 정보만 골라보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#1F2740; --sub:#6B7390;
  --line:#E4E8F2; --red:#E3350D; --yellow:#FFCB05; --navy:#2A3B8F;
  --chip-on:#1F2740; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,sans-serif;min-height:100vh;padding:32px 16px 64px}
.wrap{max-width:820px;margin:0 auto}
.pixel{font-family:'Galmuri11','Pretendard',sans-serif}

header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.lens{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #7EC8FF, #2A6BD4 65%, #17356E);border:4px solid #fff;box-shadow:0 2px 8px rgba(31,39,64,.25);flex-shrink:0}
header h1{font-size:22px;letter-spacing:-.5px}
header p{font-size:13px;color:var(--sub);margin-top:2px}

.search-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 1px 3px rgba(31,39,64,.06)}
.search-row{display:flex;gap:8px}
.search-row input{flex:1;min-width:0;font-size:16px;padding:12px 16px;border:2px solid var(--line);border-radius:12px;outline:none;font-family:inherit;background:#FAFBFE}
.search-row input:focus{border-color:var(--navy)}
.search-row button{white-space:nowrap;flex-shrink:0;font-size:15px;font-weight:700;padding:12px 22px;border:none;border-radius:12px;background:var(--red);color:#fff;cursor:pointer;font-family:inherit;transition:transform .08s}
.search-row button:hover{transform:translateY(-1px)}
.search-row button:active{transform:translateY(0)}

.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.toggles .label{font-size:12px;color:var(--sub);width:100%;margin-bottom:-2px}
.chip{font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;font-family:inherit;transition:all .12s}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:#fff}
.chip:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

.status{margin:28px 0;text-align:center;color:var(--sub);font-size:14px}
.status .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:6px}
.suggest{margin-top:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.suggest button{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:var(--navy);font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
.ball{width:34px;height:34px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(#E3350D 46%, #1F2740 46%, #1F2740 54%, #fff 54%);position:relative;animation:spin 1s linear infinite}
.ball::after{content:'';position:absolute;inset:0;margin:auto;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid #1F2740}
.mini-loading{font-size:13px;color:var(--sub);padding:6px 0}
.mini-loading::before{content:'◓ ';color:var(--red)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-top:16px;box-shadow:0 1px 3px rgba(31,39,64,.06)}
.card h2{font-size:14px;letter-spacing:.5px;color:var(--sub);display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.card h2::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--yellow)}
.card h2 .note{font-weight:400;font-size:12px}
.empty{font-size:13.5px;color:var(--sub)}

.profile{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.sprite-box{width:130px;height:130px;border-radius:16px;background:#F6F8FD;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sprite-box img{width:112px;height:112px}
.profile-info .dex-no{font-size:13px;color:var(--sub)}
.profile-info .name{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:2px 0 4px}
.profile-info .genus{font-size:13px;color:var(--sub);margin-bottom:10px}
.type-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tchip{font-size:12.5px;font-weight:700;color:#fff;padding:4px 12px;border-radius:6px;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.meta{font-size:13px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}

.stat-row{display:grid;grid-template-columns:74px 44px 1fr;gap:10px;align-items:center;margin-bottom:9px}
.stat-row .sname{font-size:13px;color:var(--sub);font-weight:600}
.stat-row .sval{font-size:14px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:6px;background:#EEF1F8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;width:0;transition:width .6s cubic-bezier(.2,.8,.3,1)}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.total-row span{font-size:13px;color:var(--sub);font-weight:600}
.total-row b{font-size:18px;font-weight:800;background:var(--yellow);padding:3px 14px;border-radius:8px;font-variant-numeric:tabular-nums}

.eff-shelf{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.eff-shelf:last-child{border-bottom:none}
.mult{font-size:14px;font-weight:800;text-align:center;padding:5px 0;border-radius:8px;font-variant-numeric:tabular-nums}
.m4{background:#7A0F1D;color:#fff}.m2{background:#E3350D;color:#fff}.m1{background:#EEF1F8;color:var(--sub)}
.m05{background:#2E7D32;color:#fff}.m025{background:#14532D;color:#fff}.m0{background:#1F2740;color:#fff}
.eff-types{display:flex;gap:6px;flex-wrap:wrap;padding-top:2px}

/* 기술 목록 */
.move-list{display:flex;flex-direction:column;gap:8px}
.move-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#FAFBFE;flex-wrap:wrap}
.move-row.clickable{min-height:44px}
.move-row .mname{font-weight:700;font-size:14px}
.move-row .mmeta{font-size:12px;color:var(--sub);margin-left:auto;display:flex;gap:10px;font-variant-numeric:tabular-nums}
.move-row .freq{font-size:11.5px;font-weight:700;color:var(--navy);background:#EDF0FC;padding:2px 8px;border-radius:999px}
.sig-badge{font-size:11px;font-weight:800;color:#fff;background:var(--red);padding:2px 8px;border-radius:999px}
.tchip.small{font-size:11px;padding:2.5px 9px;border-radius:5px}
.move-row.clickable{cursor:pointer;transition:background .1s,border-color .1s}
.item-icon{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;flex-shrink:0}
.move-row.clickable:hover{background:#F0F3FC;border-color:#C9D2EA}
.move-row .chev{font-size:11px;color:var(--sub);transition:transform .15s}
.move-row.open .chev{transform:rotate(180deg)}
.move-detail{width:100%;order:99;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink);line-height:1.7}
.move-detail .dstat{display:flex;gap:14px;font-size:12.5px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.move-detail .dstat b{color:var(--ink)}
.wiki-link{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--navy);text-decoration:none;padding:5px 12px;border:1px solid var(--line);border-radius:999px}
.wiki-link:hover{background:#F0F3FC}
.move-detail .mini-loading{padding:2px 0}

/* 모습 그리드 */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.form-cell{text-align:center;border:1px solid var(--line);border-radius:12px;padding:12px 8px;background:#FAFBFE}
.form-cell img{width:80px;height:80px;image-rendering:pixelated}
.form-cell .fname{font-size:12.5px;font-weight:600;margin-top:4px;word-break:keep-all}

/* 특성 */
.abil{padding:12px 0;border-bottom:1px solid var(--line)}
.abil:last-child{border-bottom:none;padding-bottom:0}
.abil:first-child{padding-top:0}
.abil .aname{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.hidden-badge{font-size:11px;font-weight:700;color:#fff;background:var(--navy);padding:2px 8px;border-radius:999px}
.abil .adesc{font-size:13.5px;color:var(--sub);margin-top:4px;line-height:1.6}

/* 메가 종족값 표 */
.mega-head{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.mega-head img{width:90px;height:90px}
.mega-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}

.mega-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-size:12.5px;color:var(--sub)}
.mega-legend .lg{display:inline-flex;align-items:center;gap:6px}
.mega-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mstat-block{margin-bottom:14px}
.mstat-block:last-of-type{margin-bottom:0}
.mstat-block .mlabel{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.mbar-row{display:grid;grid-template-columns:64px 46px 1fr;gap:8px;align-items:center;margin-bottom:4px}
.mbar-row .mtag{font-size:11.5px;color:var(--sub);text-align:right}
.mbar-row .mval{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.mbar-row .mval .d{font-size:10.5px;font-weight:700;margin-left:3px}
.mbar-row .bar{height:10px}
.mega-total{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.mega-total .tbox{flex:1;min-width:100px;text-align:center;background:#FAFBFE;border:1px solid var(--line);border-radius:12px;padding:10px 8px}
.mega-total .tbox .tlabel{font-size:11px;color:var(--sub);margin-bottom:3px}
.mega-total .tbox .tval{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.mega-total .tbox .tval .d{font-size:11px;margin-left:3px}
.delta{font-size:11.5px;font-weight:700}
.delta.up{color:#2E7D32}.delta.down{color:var(--red)}.delta.same{color:var(--sub)}

/* Z기술 / 거다이맥스 */
.zmove{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#FAFBFE;flex-wrap:wrap;margin-bottom:10px}
.zmove:last-child{margin-bottom:0}
.zmove .zname{font-weight:800;font-size:15px}
.zmove .zdetail{font-size:12.5px;color:var(--sub)}
.gmax-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.gmax-wrap img{width:120px;height:120px}

.flavor{font-size:14.5px;line-height:1.75;color:var(--ink)}
.flavor .ver{font-size:12px;color:var(--sub);margin-top:8px}

footer{margin-top:30px;text-align:center;font-size:12px;color:var(--sub)}
footer a{color:var(--navy)}
footer .rights{margin-top:8px;line-height:1.6}

/* 포트폴리오로 돌아가기 */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin:-8px 0 12px;padding:0 4px;font-size:14px;font-weight:700;color:var(--sub);text-decoration:none;border-radius:10px}
.back:hover{color:var(--navy)}
.back:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

@media (max-width:520px){.stat-row{grid-template-columns:60px 38px 1fr}.profile{gap:14px}}
@media (prefers-reduced-motion:reduce){.ball{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 포트폴리오로 돌아가기</a>
  <header>
    <div class="lens" aria-hidden="true"></div>
    <div>
      <h1 class="pixel">미니 도감</h1>
      <p>포켓몬 이름을 검색하고, 보고 싶은 정보만 골라 보세요</p>
    </div>
  </header>

  <div class="search-card">
    <div class="search-row">
      <input id="q" list="names" placeholder="예: 피카츄, 리자몽, 뮤츠 (영어도 가능)" autocomplete="off">
      <datalist id="names"></datalist>
      <button id="go">검색</button>
    </div>
    <div class="toggles" role="group" aria-label="표시할 정보 선택">
      <span class="label">표시할 정보</span>
      <button class="chip" data-sec="basic" aria-pressed="true">기본 정보</button>
      <button class="chip" data-sec="stats" aria-pressed="true">종족치</button>
      <button class="chip" data-sec="def" aria-pressed="true">방어 상성</button>
      <button class="chip" data-sec="moves" aria-pressed="false">자주 쓰는 기술</button>
      <button class="chip" data-sec="items" aria-pressed="false">자주 쓰는 도구</button>
      <button class="chip" data-sec="sig" aria-pressed="false">전용기</button>
      <button class="chip" data-sec="forms" aria-pressed="false">모습</button>
      <button class="chip" data-sec="abil" aria-pressed="false">특성</button>
      <button class="chip" data-sec="mega" aria-pressed="false">폼별 종족값</button>
      <button class="chip" data-sec="gmax" aria-pressed="false">거다이맥스</button>
      <button class="chip" data-sec="zmove" aria-pressed="false">전용 Z기술</button>
      <button class="chip" data-sec="flavor" aria-pressed="false">도감 설명</button>
    </div>
  </div>

  <div id="out"></div>

  <footer>
    데이터: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a> + <a href="https://data.pkmn.cc" target="_blank" rel="noopener">Smogon(pkmn)</a> · 한국어 이름 1025종 내장
    <p class="rights">이 페이지는 공부를 위해 만든 비공식 팬 프로젝트예요.<br>포켓몬의 이름·이미지 등 모든 권리는 Nintendo · Creatures · GAME FREAK · The Pokémon Company에 있어요.</p>
  </footer>
</div>

function nameToId(input) {
  const q = input.trim().normalize('NFC');
  if (!q) return null;
  if (/^\d+$/.test(q)) return {id:+q};
  const i = koNames.findIndex(n => n === q);
  if (i >= 0) return {id:i+1};
  return {slug:q.toLowerCase().replace(/\s+/g,'-')};
}
function similar(q) {
  const nq = q.normalize('NFC');
  return koNames.filter(n => n.includes(nq)).slice(0,5);
}
async function jget(url) {
  let r;
  try {
    r = await fetch(url);
  } catch(e) {
    const err = new Error('NETWORK_BLOCKED');
    err.isNetwork = true;
    throw err;
  }
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function getType(name) {
  if (!typeCache.has(name)) typeCache.set(name, (await jget(`${API}/type/${name}`)).damage_relations);
  return typeCache.get(name);
}
function slugifyMove(en) {
  return en.toLowerCase().replace(/[’'.]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
async function getMove(slug) {
  if (moveCache.has(slug)) return moveCache.get(slug);
  const p = (async () => {
    try {
      const m = await jget(`${API}/move/${slug}`);
      const ko = m.names.find(n=>n.language.name==='ko');
      return {ko: ko?ko.name:m.name, type:m.type.name, power:m.power, cls:m.damage_class?.name, learnedBy:m.learned_by_pokemon, slug: m.name};
    } catch(e) {
      if (slug.startsWith('hidden-power-')) return getMove('hidden-power');
      return null;
    }
  })();
  moveCache.set(slug, p);
  return p;
}
function getSmogon() {
  if (!smogonPromise) smogonPromise = fetch('https://data.pkmn.cc/sets/gen9.json').then(r=>r.json()).catch(()=>null);
  return smogonPromise;
}

async function search() {
  const q = $('#q').value.trim();
  if (!q) return;
  const key = nameToId(q);
  const token = ++searchToken;
  out.innerHTML = `<div class="status"><div class="ball"></div>도감을 넘기는 중...</div>`;
  try {
    const ref = key.id ?? key.slug;
    const p = await jget(`${API}/pokemon/${ref}`);
    const sp = await jget(p.species.url);

    const mult = {}; ALL_TYPES.forEach(t => mult[t] = 1);
    for (const t of p.types) {
      const rel = await getType(t.type.name);
      rel.double_damage_from.forEach(x => mult[x.name] *= 2);
      rel.half_damage_from.forEach(x => mult[x.name] *= 0.5);
      rel.no_damage_from.forEach(x => mult[x.name] *= 0);
    }
    const abilities = await Promise.all(p.abilities.map(async a => {
      const d = await jget(a.ability.url);
      const ko = d.names.find(n => n.language.name === 'ko');
      const flavs = d.flavor_text_entries.filter(f=>f.language.name==='ko');
      return {name: ko ? ko.name : a.ability.name, hidden: a.is_hidden,
              desc: flavs.length ? flavs[flavs.length-1].flavor_text.replace(/\s+/g,' ') : ''};
    }));
    if (token !== searchToken) return;
    lastData = {token, p, sp, mult, abilities, extra:{}, loading:{}};
    render(lastData);
  } catch(e) {
    if (token !== searchToken) return;
    if (e && e.isNetwork) {
      out.innerHTML = `<div class="status">
        <div class="big">인터넷 요청이 막혀 있어요</div>
        이 페이지를 "미리보기"나 메신저 내장 뷰어로 열면 검색이 안 될 수 있어요.<br>
        Chrome이나 Safari 같은 정식 브라우저 앱으로 파일을 열어보세요.
      </div>`;
      return;
    }
    const sug = similar(q);
    out.innerHTML = `<div class="status">
      <div class="big">'${q}' 을(를) 찾지 못했어요</div>
      한국어 정식 명칭 또는 영어 이름으로 검색해 보세요.
      ${sug.length ? `<div class="suggest">${sug.map(s=>`<button onclick="pick('${s}')">${s}</button>`).join('')}</div>` : ''}
    </div>`;
  }
}
function pick(name){ $('#q').value = name; search(); }
function tchip(t, small){ return `<span class="tchip${small?' small':''}" style="background:${TYPE_COLOR[t]||'#9FA19F'}">${TYPE_KO[t]||t}</span>`; }
function statColor(v){ return v<50?'#E3350D':v<80?'#F0A02C':v<110?'#3FA129':'#2A6BD4'; }
function formLabel(varName, base){
  if (varName === base) return '기본';
  let sfx = varName.startsWith(base+'-') ? varName.slice(base.length+1) : varName;
  // 긴 토큰 먼저 매칭
  const parts = [];
  let rest = sfx;
  while (rest) {
    const keys = Object.keys(FORM_KO).sort((a,b)=>b.length-a.length);
    const hit = keys.find(k => rest === k || rest.startsWith(k+'-'));
    if (hit) { parts.push(FORM_KO[hit]); rest = rest.slice(hit.length).replace(/^-/,''); }
    else { const tok = rest.split('-')[0]; parts.push(tok); rest = rest.slice(tok.length).replace(/^-/,''); }
  }
  return parts.join(' ');
}
let moveRowSeq = 0;

/* ── 지연 로딩 섹션들 ── */
async function ensure(key, loader) {
  const d = lastData;
  if (!d || d.extra[key] !== undefined || d.loading[key]) return;
  d.loading[key] = true;
  try { const val = await loader(d); if (lastData && lastData.token === d.token) { d.extra[key] = val; } }
  catch(e) { if (lastData && lastData.token === d.token) d.extra[key] = {error:true}; }
  finally { if (lastData && lastData.token === d.token) { d.loading[key] = false; render(lastData); } }
}

async function loadMoves(d) {
  const enName = d.sp.names.find(n=>n.language.name==='en')?.name ?? d.p.name;
  const smogon = await getSmogon();
  const entry = smogon ? smogon[enName] : null;
  if (entry) {
    const counts = new Map();
    const formats = Object.keys(entry);
    for (const fmt of formats) for (const setName of Object.keys(entry[fmt])) {
      const mv = entry[fmt][setName].moves || [];
      mv.flat().forEach(en => counts.set(en, (counts.get(en)||0)+1));
    }
    const top = [...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
    const details = await Promise.all(top.map(async ([en,c]) => ({en, c, m: await getMove(slugifyMove(en))})));
    return {mode:'smogon', formats, moves:details};
  }
  // Smogon 데이터 없음 → 최신 레벨업 기술로 대체
  const vgCount = {};
  d.p.moves.forEach(mv => mv.version_group_details.forEach(v => {
    if (v.move_learn_method.name==='level-up') vgCount[v.version_group.name]=(vgCount[v.version_group.name]||0)+1;
  }));
  const bestVg = Object.entries(vgCount).sort((a,b)=>b[1]-a[1])[0]?.[0];
  if (!bestVg) return {mode:'none'};
  const lv = [];
  d.p.moves.forEach(mv => {
    const det = mv.version_group_details.find(v=>v.version_group.name===bestVg && v.move_learn_method.name==='level-up');
    if (det) lv.push({slug:mv.move.name, level:det.level_learned_at});
  });
  lv.sort((a,b)=>a.level-b.level);
  const details = await Promise.all(lv.slice(0,20).map(async x => ({level:x.level, m:await getMove(x.slug)})));
  return {mode:'levelup', vg:bestVg, moves:details};
}

const itemCache = new Map();
function slugifyItem(en) {
  return en.toLowerCase().replace(/[’'.]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
async function getItem(slug) {
  if (itemCache.has(slug)) return itemCache.get(slug);
  const p = (async () => {
    try {
      let it;
      try { it = await jget(`${API}/item/${slug}`); }
      catch(e) {
        // Z크리스탈은 PokéAPI에서 "xxxium-z--held" 형태 슬러그를 씀
        if (/-z$/.test(slug)) it = await jget(`${API}/item/${slug}--held`);
        else throw e;
      }
      const ko = it.names.find(n=>n.language.name==='ko');
      return {ko: ko?ko.name:it.name, sprite: it.sprites?.default};
    } catch(e) { return null; }
  })();
  itemCache.set(slug, p);
  return p;
}
async function loadItems(d) {
  const enName = d.sp.names.find(n=>n.language.name==='en')?.name ?? d.p.name;
  const smogon = await getSmogon();
  const entry = smogon ? smogon[enName] : null;
  if (!entry) return {mode:'none'};
  const counts = new Map();
  const formats = Object.keys(entry);
  for (const fmt of formats) for (const setName of Object.keys(entry[fmt])) {
    const it = entry[fmt][setName].item;
    if (!it) continue;
    (Array.isArray(it) ? it : [it]).forEach(en => {
      if (en.trim().toLowerCase() === 'no item') return;
      counts.set(en, (counts.get(en)||0)+1);
    });
  }
  if (!counts.size) return {mode:'none'};
  const top = [...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
  const details = await Promise.all(top.map(async ([en,c]) => ({en, c, it: await getItem(slugifyItem(en))})));
  return {mode:'smogon', formats, items:details};
}

async function loadSig(d) {
  const evo = await jget(d.sp.evolution_chain.url);
  const family = [];
  (function walk(node){ family.push(node.species.name); node.evolves_to.forEach(walk); })(evo.chain);
  // 이 종의 다른 폼(메가/블랙큐레무/황혼의갈기 등)도 전용기 판별 대상에 포함
  const varietyNames = d.sp.varieties.map(v=>v.pokemon.name);
  const familyAll = [...new Set([...family, ...varietyNames])];
  // DNA 다이버로 융합되는 케이스: 제크로무↔블랙큐레무, 레시라무↔화이트큐레무는
  // 서로의 전용기(크로스썬더/크로스플레임)를 공유하므로 예외적으로 같은 계열 취급
  const FUSION_FAMILY = {zekrom:['kyurem-black'], reshiram:['kyurem-white'], kyurem:['zekrom','reshiram']};
  if (FUSION_FAMILY[d.sp.name]) familyAll.push(...FUSION_FAMILY[d.sp.name]);

  const baseVariety = d.sp.varieties.find(v=>v.is_default) || d.sp.varieties[0];
  const baseData = baseVariety.pokemon.name === d.p.name ? d.p : await jget(baseVariety.pokemon.url);
  const baseMoveNames = new Set(baseData.moves.map(mv=>mv.move.name));

  const otherVarieties = d.sp.varieties.filter(v => v.pokemon.name !== d.p.name);
  const otherMoveLists = await Promise.all(otherVarieties.map(async v => {
    try { const vp = await jget(v.pokemon.url); return vp.moves; } catch(e) { return []; }
  }));
  const seen = new Set();
  const allMoveEntries = [];
  [d.p.moves, ...otherMoveLists].flat().forEach(mv => {
    if (!seen.has(mv.move.name)) { seen.add(mv.move.name); allMoveEntries.push(mv); }
  });

  const cands = allMoveEntries.filter(mv => mv.version_group_details.some(v => !['machine','tutor'].includes(v.move_learn_method.name))).slice(0,90);
  const results = await Promise.all(cands.map(async mv => ({slug:mv.move.name, m:await getMove(mv.move.name), inBase: baseMoveNames.has(mv.move.name)})));
  const sig = results.filter(({m, inBase}) => m && (
       (m.learnedBy && m.learnedBy.length>0 && m.learnedBy.every(l => familyAll.some(f => l.name===f || l.name.startsWith(f+'-')))) // 완전 전용기
    || !inBase // 기본 폼에는 없고 다른 폼(블랙/화이트 큐레무 등)에서만 배우는 폼 전용기
  ));
  return {family:familyAll, moves:sig.map(x=>x.m)};
}

async function loadForms(d) {
  const vars = d.sp.varieties.slice(0,14);
  const list = await Promise.all(vars.map(async v => {
    try {
      const vp = await jget(v.pokemon.url);
      return {name:v.pokemon.name, img: vp.sprites.front_default || vp.sprites.other['official-artwork'].front_default};
    } catch(e){ return null; }
  }));
  const forms = list.filter(x=>x&&x.img);
  const female = d.p.sprites.front_female;
  return {forms, female, total:d.sp.varieties.length};
}

async function loadMega(d) {
  const baseVariety = d.sp.varieties.find(v=>v.is_default) || d.sp.varieties[0];
  const baseData = baseVariety.pokemon.name === d.p.name ? d.p : await jget(baseVariety.pokemon.url);
  const baseStats = baseData.stats.map(s=>s.base_stat);
  const others = d.sp.varieties.filter(v => v.pokemon.name !== baseVariety.pokemon.name);
  if (!others.length) return {none:true};
  const fetched = await Promise.all(others.map(async v => {
    try {
      const vp = await jget(v.pokemon.url);
      const stats = vp.stats.map(s=>s.base_stat);
      const differs = stats.some((s,i) => s !== baseStats[i]);
      if (!differs) return null; // 스탯이 같은 폼(거다이맥스, 색만 다른 폼 등)은 제외
      return {name:v.pokemon.name, img: vp.sprites.other['official-artwork'].front_default || vp.sprites.front_default,
              stats: vp.stats.map(s=>({k:s.stat.name, v:s.base_stat}))};
    } catch(e) { return null; }
  }));
  const megas = fetched.filter(Boolean);
  if (!megas.length) return {none:true};
  return {megas, baseName: baseVariety.pokemon.name};
}

async function loadGmax(d) {
  const g = d.sp.varieties.find(v=>v.pokemon.name.endsWith('-gmax'));
  if (!g) return {none:true};
  const vp = await jget(g.pokemon.url);
  return {img: vp.sprites.other['official-artwork'].front_default || vp.sprites.front_default,
          move: GMAX_MOVES[d.sp.name] || null};
}

async function loadZ(d) {
  const slugs = Z_MOVES[d.sp.name];
  if (!slugs) return {none:true};
  const moves = (await Promise.all(slugs.map(getMove))).filter(Boolean);
  return {moves};
}

const LOADERS = {moves:loadMoves, items:loadItems, sig:loadSig, forms:loadForms, mega:loadMega, gmax:loadGmax, zmove:loadZ};

function render(d) {

  const koName = sp.names.find(n => n.language.name === 'ko')?.name ?? p.name;

  let html = '';

  if (sections.basic) {

          <div class="dex-no pixel">No.${String(sp.id).padStart(4,'0')}</div>
          <div class="name">${koName}</div>

          <div class="type-chips">${p.types.map(t=>tchip(t.type.name)).join('')}</div>

            <span>몸무게 <b>${(p.weight/10).toFixed(1)}kg</b></span>
            <span>특성 <b>${abilities.map(a=>a.name+(a.hidden?' (숨겨진 특성)':'')).join(', ')}</b></span>
          </div>
        </div>
      </div></div>`;
  }

  if (sections.stats) {
    const rows = p.stats.map(s => {
      const v = s.base_stat;
      return `<div class="stat-row"><span class="sname">${STAT_KO[s.stat.name]}</span><span class="sval">${v}</span>
        <div class="bar"><i data-w="${Math.min(v/180*100,100)}" style="background:${statColor(v)}"></i></div></div>`;
    }).join('');
    const total = p.stats.reduce((a,s)=>a+s.base_stat,0);
    html += `<div class="card"><h2>종족치</h2>${rows}<div class="total-row"><span>합계</span><b>${total}</b></div></div>`;
  }

  if (sections.def) {
    const buckets = [{m:4,cls:'m4',label:'×4'},{m:2,cls:'m2',label:'×2'},{m:1,cls:'m1',label:'×1'},{m:0.5,cls:'m05',label:'×0.5'},{m:0.25,cls:'m025',label:'×0.25'},{m:0,cls:'m0',label:'×0'}];
    const shelves = buckets.map(b => {
      const ts = ALL_TYPES.filter(t => mult[t] === b.m);
      return ts.length ? `<div class="eff-shelf"><span class="mult ${b.cls}">${b.label}</span><div class="eff-types">${ts.map(t=>tchip(t)).join('')}</div></div>` : '';
    }).join('');
    html += `<div class="card"><h2>방어 상성 <span class="note">(특성 미적용)</span></h2>${shelves}</div>`;
  }

  if (sections.moves) {
    const x = d.extra.moves;
    if (x === undefined) { html += loadingCard('자주 쓰는 기술'); ensure('moves', LOADERS.moves); }
    else if (x.error || x.mode==='none') html += `<div class="card"><h2>자주 쓰는 기술</h2><p class="empty">기술 데이터를 불러오지 못했어요.</p></div>`;
    else if (x.mode==='smogon') {
      html += `<div class="card"><h2>자주 쓰는 기술 <span class="note">Smogon 실전 세트 기준 (${x.formats.join(', ')})</span></h2>
        <div class="move-list">${x.moves.map(({c,m,en}) => m ? moveRow(m, `<span class="freq">채용 ${c}회</span>`) : moveRow({ko:en,type:'normal',power:null,cls:null})).join('')}</div></div>`;
    } else {
      html += `<div class="card"><h2>자주 쓰는 기술 <span class="note">실전 데이터가 없어 레벨업 기술로 대체 (${x.vg})</span></h2>
        <div class="move-list">${x.moves.map(({level,m}) => m ? moveRow(m, `<span class="freq">Lv.${level||'—'}</span>`) : '').join('')}</div></div>`;
    }
  }

  if (sections.items) {
    const x = d.extra.items;
    if (x === undefined) { html += loadingCard('자주 쓰는 도구'); ensure('items', LOADERS.items); }
    else if (x.error || x.mode==='none') html += `<div class="card"><h2>자주 쓰는 도구</h2><p class="empty">실전 사용 데이터가 없어요. (경쟁전에 자주 나오지 않는 포켓몬일 수 있어요)</p></div>`;
    else {
      html += `<div class="card"><h2>자주 쓰는 도구 <span class="note">Smogon 실전 세트 기준 (${x.formats.join(', ')})</span></h2>
        <div class="move-list">${x.items.map(({c,it,en}) => `
          <div class="move-row">
            ${it&&it.sprite?`<img class="item-icon" src="${it.sprite}" alt="">`:''}
            <span class="mname">${it?it.ko:en}</span>
            <span class="freq">채용 ${c}회</span>
          </div>`).join('')}</div></div>`;
    }
  }

  if (sections.sig) {
    const x = d.extra.sig;
    if (x === undefined) { html += loadingCard('전용기'); ensure('sig', LOADERS.sig); }
    else if (x.error) html += `<div class="card"><h2>전용기</h2><p class="empty">전용기 판별에 실패했어요.</p></div>`;
    else if (!x.moves.length) html += `<div class="card"><h2>전용기</h2><p class="empty">이 진화 계열만 배우는 기술이 없어요. (레벨업·유전·이벤트 기술 기준)</p></div>`;
    else html += `<div class="card"><h2>전용기 <span class="note">이 진화 계열만 배우는 기술</span></h2>
      <div class="move-list">${x.moves.map(m => moveRow(m, `<span class="sig-badge">전용</span>`)).join('')}</div></div>`;
  }

  if (sections.forms) {
    const x = d.extra.forms;
    if (x === undefined) { html += loadingCard('모습'); ensure('forms', LOADERS.forms); }
    else if (x.error) html += `<div class="card"><h2>모습</h2><p class="empty">폼 데이터를 불러오지 못했어요.</p></div>`;
    else {
      let cells = x.forms.map(f => `<div class="form-cell"><img src="${f.img}" alt="${f.name}" loading="lazy"><div class="fname">${formLabel(f.name, sp.name)}</div></div>`).join('');
      if (x.female) cells += `<div class="form-cell"><img src="${x.female}" alt="암컷" loading="lazy"><div class="fname">암컷 (성별 차이)</div></div>`;
      const more = x.total > x.forms.length ? `<p class="empty" style="margin-top:10px">외 ${x.total - x.forms.length}종의 모습이 더 있어요.</p>` : '';
      html += `<div class="card"><h2>모습</h2><div class="form-grid">${cells}</div>${more}</div>`;
    }
  }

  if (sections.abil) {
    html += `<div class="card"><h2>특성</h2>${abilities.map(a => `
      <div class="abil">
        <div class="aname">${a.name} ${a.hidden?'<span class="hidden-badge">숨겨진 특성</span>':''}</div>
        <div class="adesc">${a.desc || '설명 없음'}</div>
      </div>`).join('')}</div>`;
  }

  if (sections.mega) {
    const x = d.extra.mega;
    if (x === undefined) { html += loadingCard('폼별 종족값'); ensure('mega', LOADERS.mega); }
    else if (x.error) html += `<div class="card"><h2>폼별 종족값</h2><p class="empty">데이터를 불러오지 못했어요.</p></div>`;
    else if (x.none) html += `<div class="card"><h2>폼별 종족값</h2><p class="empty">${koName}은(는) 종족값이 다른 폼(메가진화 등)이 없어요.</p></div>`;
    else {
      const baseStats = p.stats.map(s=>({k:s.stat.name, v:s.base_stat}));
      const FORM_COLORS = ['#E3350D','#2A6BD4','#3FA129','#9141CB','#E7B10A','#60A1B8'];
      const maxScale = Math.max(200, ...x.megas.flatMap(m=>m.stats.map(s=>s.v)));
      const imgs = x.megas.map(m=>m.img?`<img src="${m.img}" alt="${m.name}">`:'').join('');
      const legend = `<div class="mega-legend">
        ${x.megas.map((m,mi)=>`<span class="lg"><i style="background:${FORM_COLORS[mi%FORM_COLORS.length]}"></i>${formLabel(m.name, sp.name)}</span>`).join('')}
      </div>`;
      const blocks = x.megas.map((m,mi) => {
        const tag = formLabel(m.name, sp.name).replace(/^메가 /,'');
        const statBars = baseStats.map((bs,i) => {
          const mv = m.stats[i].v, diff = mv-bs.v;
          const w = Math.min(mv/maxScale*100, 100);
          const cls = diff>0?'up':diff<0?'down':'same';
          const sign = diff>0?'+':'';
          return `<div class="mbar-row"><span class="mtag">${STAT_KO[bs.k]}</span><span class="mval">${mv}<span class="delta d ${cls}">${sign}${diff}</span></span><div class="bar"><i data-w="${w}" style="background:${FORM_COLORS[mi%FORM_COLORS.length]}"></i></div></div>`;
        }).join('');
        return `<div class="mstat-block"><div class="mlabel" style="color:${FORM_COLORS[mi%FORM_COLORS.length]}">${tag}</div>${statBars}</div>`;
      }).join('');
      const bTot = baseStats.reduce((a,s)=>a+s.v,0);
      const totalBoxes = `<div class="mega-total">
        ${x.megas.map((m,mi)=>{ const t=m.stats.reduce((a,s)=>a+s.v,0); const tag=formLabel(m.name,sp.name);
          return `<div class="tbox"><div class="tlabel">${tag}</div><div class="tval" style="color:${FORM_COLORS[mi%FORM_COLORS.length]}">${t}<span class="delta d ${t-bTot>=0?'up':'down'}">${t-bTot>=0?'+':''}${t-bTot}</span></div></div>`; }).join('')}
      </div>`;
      html += `<div class="card"><h2>폼별 종족값</h2>
        <div class="mega-head">${imgs}</div>
        ${legend}${blocks}${totalBoxes}</div>`;
    }
  }

  if (sections.gmax) {
    const x = d.extra.gmax;
    if (x === undefined) { html += loadingCard('거다이맥스'); ensure('gmax', LOADERS.gmax); }
    else if (x.error) html += `<div class="card"><h2>거다이맥스</h2><p class="empty">데이터를 불러오지 못했어요.</p></div>`;
    else if (x.none) html += `<div class="card"><h2>거다이맥스</h2><p class="empty">${koName}은(는) 거다이맥스가 없어요.</p></div>`;
    else html += `<div class="card"><h2>거다이맥스</h2>
      <div class="gmax-wrap">
        ${x.img?`<img src="${x.img}" alt="거다이맥스">`:''}
        <div>
          <div style="font-weight:800;font-size:16px;margin-bottom:4px">거다이맥스 ${koName}</div>
          ${x.move?`<div class="zdetail" style="font-size:13px;color:var(--sub)">전용 거다이맥스 기술: <b style="color:var(--ink)">${x.move}</b></div>
          <a class="wiki-link" href="https://namu.wiki/Search?q=${encodeURIComponent(x.move)}" target="_blank" rel="noopener">나무위키에서 자세히 보기 ↗</a>`:''}
        </div>
      </div></div>`;
  }

  if (sections.zmove) {
    const x = d.extra.zmove;
    if (x === undefined) { html += loadingCard('전용 Z기술'); ensure('zmove', LOADERS.zmove); }
    else if (x.error) html += `<div class="card"><h2>전용 Z기술</h2><p class="empty">데이터를 불러오지 못했어요.</p></div>`;
    else if (x.none || !x.moves.length) html += `<div class="card"><h2>전용 Z기술</h2><p class="empty">${koName}의 전용 Z기술은 없어요. (범용 Z기술은 사용 가능)</p></div>`;
    else html += `<div class="card"><h2>전용 Z기술</h2>${x.moves.map(m=>`
      <div class="zmove">${tchip(m.type)}
        <div><div class="zname">${m.ko}</div>
        <div class="zdetail">${m.cls?CLASS_KO[m.cls]+' · ':''}위력 ${m.power ?? '—'}</div>
        <a class="wiki-link" href="https://namu.wiki/Search?q=${encodeURIComponent(m.ko)}" target="_blank" rel="noopener">나무위키에서 자세히 보기 ↗</a></div>
      </div>`).join('')}</div>`;
  }

  if (sections.flavor) {
    const entries = sp.flavor_text_entries.filter(f => f.language.name === 'ko');
    const fl = entries.length ? entries[entries.length-1] : null;
    html += `<div class="card"><h2>도감 설명</h2>
      ${fl ? `<p class="flavor">${fl.flavor_text.replace(/\s+/g,' ')}</p><p class="flavor ver">— ${fl.version.name} 버전</p>`
           : `<p class="flavor" style="color:var(--sub)">한국어 도감 설명이 없어요.</p>`}</div>`;
  }

  if (!html) html = `<div class="status">표시할 정보를 위에서 하나 이상 선택해 주세요.</div>`;
  out.innerHTML = html;
  requestAnimationFrame(() => {
    out.querySelectorAll('.bar i').forEach(i => { i.style.width = i.dataset.w + '%'; });
  });
}
</script>
</body>
</html>
